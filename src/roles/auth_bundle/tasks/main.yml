---
- name: Create output directory
  ansible.builtin.file:
    path: "{{ auth_bundle_output_directory }}"
    state: directory
    mode: '0755'

- name: Check for existing auth bundle
  ansible.builtin.stat:
    path: "{{ auth_bundle_output_directory }}/{{ auth_bundle_hostname }}.tar.gz"
  register: _auth_bundle_tarball

- name: Build auth bundle
  when: not _auth_bundle_tarball.stat.exists or (certificates_renew | default(false) | bool)
  block:
    - name: Create temporary directory
      ansible.builtin.tempfile:
        state: directory
        suffix: auth-bundle-build
      register: auth_bundle_build_directory

    - name: Create directory structure
      ansible.builtin.file:
        state: directory
        path: "{{ auth_bundle_build_directory.path }}/certs/{{ item }}"
        mode: '0755'
      loop:
        - certs
        - private
        - oauth

    - name: Copy default CA certificate
      ansible.builtin.copy:
        src: "{{ auth_bundle_ca_certificate }}"
        dest: "{{ auth_bundle_build_directory.path }}/certs/certs/ca.crt"
        remote_src: true
        mode: '0444'

    - name: Copy server CA certificate
      ansible.builtin.copy:
        src: "{{ auth_bundle_server_ca_certificate }}"
        dest: "{{ auth_bundle_build_directory.path }}/certs/certs/server-ca.crt"
        remote_src: true
        mode: '0444'

    - name: Copy CA bundle
      ansible.builtin.copy:
        src: "{{ auth_bundle_ca_bundle }}"
        dest: "{{ auth_bundle_build_directory.path }}/certs/certs/ca-bundle.crt"
        remote_src: true
        mode: '0444'

    - name: Copy server certificate
      ansible.builtin.copy:
        src: "{{ auth_bundle_server_certificate }}"
        dest: "{{ auth_bundle_build_directory.path }}/certs/certs/{{ auth_bundle_hostname }}.crt"
        remote_src: true
        mode: '0444'

    - name: Copy server key
      ansible.builtin.copy:
        src: "{{ auth_bundle_server_key }}"
        dest: "{{ auth_bundle_build_directory.path }}/certs/private/{{ auth_bundle_hostname }}.key"
        remote_src: true
        mode: '0440'

    - name: Copy client certificate
      ansible.builtin.copy:
        src: "{{ auth_bundle_client_certificate }}"
        dest: "{{ auth_bundle_build_directory.path }}/certs/certs/{{ auth_bundle_hostname }}-client.crt"
        remote_src: true
        mode: '0444'

    - name: Copy client key
      ansible.builtin.copy:
        src: "{{ auth_bundle_client_key }}"
        dest: "{{ auth_bundle_build_directory.path }}/certs/private/{{ auth_bundle_hostname }}-client.key"
        remote_src: true
        mode: '0440'

    - name: Copy OAuth consumer key
      ansible.builtin.copy:
        src: "{{ auth_bundle_oauth_consumer_key_file }}"
        dest: "{{ auth_bundle_build_directory.path }}/certs/oauth/foreman-oauth-consumer-key"
        mode: '0440'

    - name: Copy OAuth consumer secret
      ansible.builtin.copy:
        src: "{{ auth_bundle_oauth_consumer_secret_file }}"
        dest: "{{ auth_bundle_build_directory.path }}/certs/oauth/foreman-oauth-consumer-secret"
        mode: '0440'

    - name: Create tarball
      community.general.archive:
        path: "{{ auth_bundle_build_directory.path }}/certs/*"
        dest: "{{ auth_bundle_output_directory }}/{{ auth_bundle_hostname }}.tar.gz"
        format: gz
        mode: '0640'

    - name: Remove temporary directory
      ansible.builtin.file:
        path: "{{ auth_bundle_build_directory.path }}"
        state: absent

- name: Report auth bundle location
  ansible.builtin.debug:
    msg: "Auth bundle created: {{ auth_bundle_output_directory }}/{{ auth_bundle_hostname }}.tar.gz"

- name: Show instructions for deploying a Foreman Proxy
  vars:
    auth_bundle_local_path: "{{ auth_bundle_output_directory }}/{{ auth_bundle_hostname }}.tar.gz"
    auth_bundle_remote_path: "/root/{{ auth_bundle_hostname }}.tar.gz"
  ansible.builtin.debug:
    msg: |
      This auth bundle contains the proxy's TLS certificates and OAuth credentials. It is consumed
      by foremanctl, not foreman-installer, so there is no installer scenario command to run.

      1. Register the proxy host with this Foreman server and install foremanctl on the proxy host.
      2. From this Foreman server, copy the bundle to the proxy host:
         scp {{ auth_bundle_local_path | quote }} root@{{ auth_bundle_hostname }}:{{ auth_bundle_remote_path | quote }}
      3. On the proxy host, use foremanctl deploy-proxy to install the Foreman Proxy.
         A Satellite Capsule uses the capsule flavor instead:

         Foreman:
         foremanctl deploy-proxy \
           --flavor foreman-proxy-content \
           --auth-bundle {{ ('/root/' ~ auth_bundle_hostname ~ '.tar.gz') | quote }} \\
           --foreman-fqdn {{ foreman_name | quote }}

         Satellite Capsule:
         foremanctl deploy-proxy \\
           --flavor capsule \\
           --auth-bundle {{ ('/root/' ~ auth_bundle_hostname ~ '.tar.gz') | quote }} \\
           --foreman-fqdn {{ foreman_name | quote }}

      The bundle contains private keys and OAuth credentials. Transfer it securely and restrict access to it.
